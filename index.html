<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>確率の迷宮</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', 'Orbitron', sans-serif; overflow: hidden; background-color: #030712; user-select: none; touch-action: manipulation; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glow-blue { text-shadow: 0 0 10px rgba(59,130,246,0.8), 0 0 20px rgba(59,130,246,0.5); }
        .glow-gold { text-shadow: 0 0 12px rgba(234,179,8,0.9), 0 0 25px rgba(234,179,8,0.6); }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="text-white h-screen w-screen relative overflow-hidden">

    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HUD Header -->
    <div class="absolute top-0 left-0 right-0 z-10 p-4 flex justify-between items-center pointer-events-none">
        <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
            <span id="stage-title-hud" class="font-orbitron text-xs md:text-sm font-bold text-cyan-300 uppercase">
                STAGE 1 - NEON CYBER
            </span>
        </div>

        <div class="flex items-center gap-2">
            <!-- Timer Display -->
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 font-orbitron text-xs md:text-sm text-yellow-400">
                <span>TIME:</span>
                <span id="timer-display" class="font-bold">00:00.00</span>
            </div>

            <button id="sound-btn" class="pointer-events-auto glass-panel p-2.5 rounded-2xl hover:bg-white/10">
                <svg id="sound-icon-on" class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                <svg id="sound-icon-off" class="w-5 h-5 text-gray-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/></svg>
            </button>
        </div>
    </div>

    <!-- Controls -->
    <div id="controls-container" class="absolute inset-0 z-10 flex pointer-events-none">
        <div id="left-touch-zone" class="w-1/2 h-full pointer-events-auto cursor-pointer flex items-end pb-32 justify-center">
            <button class="glass-panel border-blue-500/50 hover:bg-blue-600/30 text-blue-300 font-bold px-6 py-3 rounded-2xl transition-all">
                青のゲート [←]
            </button>
        </div>
        <div id="right-touch-zone" class="w-1/2 h-full pointer-events-auto cursor-pointer flex items-end pb-32 justify-center">
            <button class="glass-panel border-red-500/50 hover:bg-red-600/30 text-red-300 font-bold px-6 py-3 rounded-2xl transition-all">
                赤のゲート [→]
            </button>
        </div>
    </div>

    <!-- Bottom HUD: Probability & Dopamine Tracker -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-lg pointer-events-none">
        <div class="glass-panel rounded-3xl p-4 text-center border border-white/10">
            <div class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold mb-1">CURRENT PROBABILITY</div>
            <div class="flex items-center justify-center gap-2">
                <span class="text-xs text-cyan-400 font-orbitron">1 /</span>
                <span id="prob-denominator" class="text-3xl md:text-4xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-white glow-blue">2</span>
            </div>
            <div class="mt-2 flex justify-between text-xs font-mono text-gray-300 px-2 pt-2 border-t border-white/10">
                <div>到達率: <span id="prob-percent" class="text-cyan-300 font-bold">50.000%</span></div>
                <div>ドーパミンLv: <span id="dopamine-level" class="text-yellow-400 font-bold">LV 1 (NORMAL)</span></div>
            </div>
        </div>
    </div>

    <!-- Start / GameOver Modal -->
    <div id="modal-overlay" class="absolute inset-0 z-30 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 text-center border border-white/20 shadow-2xl">
            <h1 id="modal-title" class="text-3xl font-black font-orbitron mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-blue-300">
                確率の迷宮
            </h1>
            <p id="modal-desc" class="text-gray-300 text-sm leading-relaxed mb-4">
                二分の一を当て続け、運の限界に挑め！<br>
                連続正解でBGMがトランス進化！
            </p>

            <!-- Leaderboard Table -->
            <div id="ranking-box" class="mb-4 bg-black/40 rounded-2xl p-3 border border-white/10 text-left text-xs">
                <div class="font-bold font-orbitron text-cyan-400 mb-2 flex justify-between">
                    <span>🏆 全国オンラインランキング TOP 5</span>
                    <span id="ranking-status" class="text-[10px] text-gray-400">取得中...</span>
                </div>
                <div id="ranking-list" class="space-y-1 font-mono text-gray-300 max-h-32 overflow-y-auto"></div>
            </div>

            <!-- Player Input for HighScore -->
            <div id="score-submit-box" class="hidden mb-4 space-y-2">
                <input type="text" id="player-name-input" maxlength="10" placeholder="プレイヤー名を入力 (最大10文字)" class="w-full bg-slate-900/90 border border-cyan-500/50 rounded-xl px-4 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-cyan-400">
            </div>

            <button id="modal-action-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 to-indigo-600 font-orbitron font-bold text-lg text-white shadow-lg transition-all hover:scale-[1.02]">
                CHALLENGE START
            </button>
        </div>
    </div>

    <script>
        // --- ⚙️ CONFIGURATION & GAS LINK ---
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbziAMfYgf8Do3q4ipm3UjjHlueCWTIfLx_SOBeL68zu-vAM91FqdBwTxnEICA8ar1Y0zQ/exec";

        let currentStage = 0;
        let correctGate = 'blue';
        let isMoving = false;
        let isSoundMuted = false;
        let audioInitialized = false;

        // Timer
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        // Stage Themes
        const STAGE_THEMES = [
            { name: "NEON CYBER", fog: 0x030712, blue: 0x00f0ff, red: 0xff0055, type: 'cyber' },
            { name: "MIRROR WORLD", fog: 0x09090b, blue: 0xffffff, red: 0x888888, type: 'mirror' },
            { name: "UNKNOWN ENTITY", fog: 0x180202, blue: 0x00ff88, red: 0xff0000, type: 'entity' },
            { name: "DESERT PYRAMID", fog: 0x291d00, blue: 0x38bdf8, red: 0xf59e0b, type: 'desert' },
            { name: "SUNSET PLAINS", fog: 0x310022, blue: 0x06b6d4, red: 0xff007f, type: 'plains' },
            { name: "CRYSTAL ICE", fog: 0x042f2e, blue: 0x22d3ee, red: 0xf472b6, type: 'ice' },
            { name: "DEEP OCEAN", fog: 0x03182b, blue: 0x00d8ff, red: 0xff3b3b, type: 'abyss' },
            { name: "VOLCANIC CORE", fog: 0x2e0800, blue: 0x38bdf8, red: 0xff4500, type: 'lava' },
            { name: "GOLD SANCTUARY", fog: 0x1f1900, blue: 0x00ffff, red: 0xeab308, type: 'gold' }
        ];

        // --- 🎵 DOPAMINE SOUND SYSTEM (Tone.js) ---
        let synth, bassSynth, drumMembrane;
        let currentBpm = 120;

        function initAudio() {
            if (audioInitialized) return;
            Tone.start();
            
            synth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sawtooth" } }).toDestination();
            synth.volume.value = -12;

            bassSynth = new Tone.MonoSynth({ oscillator: { type: "square" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.1 } }).toDestination();
            bassSynth.volume.value = -8;

            drumMembrane = new Tone.MembraneSynth().toDestination();
            drumMembrane.volume.value = -6;

            // Interactive Loop Engine
            Tone.Transport.scheduleRepeat((time) => {
                const stage = currentStage;
                // Kick Drum
                if (stage >= 2) drumMembrane.triggerAttackRelease("C1", "8n", time);

                // Bassline
                if (stage >= 1) {
                    const notes = ["C2", "D2", "E2", "G2"];
                    bassSynth.triggerAttackRelease(notes[Math.floor(Math.random()*notes.length)], "16n", time);
                }

                // High Arpeggio (Dopamine Trigger)
                if (stage >= 4) {
                    const arps = ["C5", "E5", "G5", "B5", "C6"];
                    synth.triggerAttackRelease(arps[Math.floor(Math.random()*arps.length)], "16n", time + 0.125);
                }
            }, "4n");

            Tone.Transport.start();
            audioInitialized = true;
        }

        function updateDopamineAudio(stage) {
            if (!audioInitialized) return;
            currentBpm = Math.min(120 + stage * 6, 180); // Speed up BPM per stage
            Tone.Transport.bpm.value = currentBpm;

            const lvlText = stage < 2 ? "LV 1 (NORMAL)" : stage < 5 ? "LV 2 (HIGH)" : stage < 8 ? "LV 3 (OVERDRIVE)" : "LV MAX (EUPHORIA)";
            document.getElementById('dopamine-level').innerText = lvlText;
        }

        // --- 🎮 THREE.JS ENGINE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(STAGE_THEMES[0].fog, 0.035);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        let entityMesh = null;

        function createGateMesh(color) {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2 });
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4.5, 0.4), frameMat); p1.position.set(-1.4, 2.25, 0);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4.5, 0.4), frameMat); p2.position.set(1.4, 2.25, 0);
            const top = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.4, 0.4), frameMat); top.position.set(0, 4.3, 0);
            
            const portalMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
            const portal = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 4.1), portalMat);
            portal.position.set(0, 2.1, 0);
            group.add(p1, p2, top, portal);
            return { group, portalMat };
        }

        const leftGate = createGateMesh(STAGE_THEMES[0].blue);
        leftGate.group.position.set(-2.5, 0, -2);
        scene.add(leftGate.group);

        const rightGate = createGateMesh(STAGE_THEMES[0].red);
        rightGate.group.position.set(2.5, 0, -2);
        scene.add(rightGate.group);

        let gridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1e293b);
        scene.add(gridHelper);

        // Creature Entity
        const entityGeom = new THREE.IcosahedronGeometry(1.2, 1);
        const entityMat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
        entityMesh = new THREE.Mesh(entityGeom, entityMat);
        entityMesh.position.set(0, 2, -8);
        scene.add(entityMesh);

        function updateStageVisuals(stageIdx) {
            const theme = STAGE_THEMES[stageIdx % STAGE_THEMES.length];
            scene.fog.color.setHex(theme.fog);
            renderer.setClearColor(theme.fog);

            leftGate.portalMat.color.setHex(theme.blue);
            rightGate.portalMat.color.setHex(theme.red);

            entityMesh.visible = (theme.type === 'entity');

            document.getElementById('stage-title-hud').innerText = `STAGE ${stageIdx + 1} - ${theme.name}`;
            
            const denom = Math.pow(2, stageIdx + 1);
            document.getElementById('prob-denominator').innerText = denom.toLocaleString();
            document.getElementById('prob-percent').innerText = `${(100 / denom).toFixed(4)}%`;

            updateDopamineAudio(stageIdx);
        }

        // --- 💀 RANDOM DEATH ANIMATIONS ---
        function triggerDeathAnimation(callback) {
            const deaths = ['fall', 'eaten', 'rift'];
            const type = deaths[Math.floor(Math.random() * deaths.length)];
            let start = performance.now();

            function animateDeath(now) {
                let progress = (now - start) / 1000;
                if (type === 'fall') {
                    camera.position.y -= progress * 0.5;
                    camera.rotation.x -= 0.05;
                } else if (type === 'eaten') {
                    entityMesh.position.z += 0.4;
                    entityMesh.scale.multiplyScalar(1.05);
                } else if (type === 'rift') {
                    camera.position.x += (Math.random() - 0.5) * 0.3;
                }

                if (progress < 1.2) {
                    requestAnimationFrame(animateDeath);
                } else {
                    callback();
                }
            }
            requestAnimationFrame(animateDeath);
        }

        // --- ⏱️ TIMER LOGIC ---
        function startTimer() {
            startTime = performance.now();
            timerInterval = setInterval(() => {
                elapsedTime = performance.now() - startTime;
                let ms = Math.floor((elapsedTime % 1000) / 10);
                let sec = Math.floor((elapsedTime / 1000) % 60);
                let min = Math.floor(elapsedTime / 60000);
                document.getElementById('timer-display').innerText = 
                    `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}.${ms.toString().padStart(2,'0')}`;
            }, 30);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // --- 🏆 ONLINE RANKING (GAS FETCH) ---
        function fetchRanking() {
            const listEl = document.getElementById('ranking-list');
            const statusEl = document.getElementById('ranking-status');

            fetch(GAS_WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    statusEl.innerText = "通信完了";
                    if (!data || data.length === 0) {
                        listEl.innerHTML = "<div>記録がありません</div>";
                        return;
                    }
                    listEl.innerHTML = data.map((item, idx) => `
                        <div class="flex justify-between border-b border-white/5 py-0.5">
                            <span class="text-yellow-400 font-bold">${idx + 1}. ${item.name}</span>
                            <span class="text-cyan-300">Stage ${item.stage} (${(item.time/1000).toFixed(1)}s)</span>
                        </div>
                    `).join('');
                })
                .catch(() => { statusEl.innerText = "取得失敗"; });
        }

        function submitScore(name, stage, time) {
            const probStr = `1/${Math.pow(2, stage)}`;
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ name: name, stage: stage, prob: probStr, time: Math.floor(time) })
            }).then(() => fetchRanking());
        }

        // --- GAMEPLAY CONTROL ---
        function selectGate(color) {
            if (isMoving) return;
            isMoving = true;
            initAudio();

            const isCorrect = (color === correctGate);
            const targetX = color === 'blue' ? -2.5 : 2.5;

            let start = performance.now();
            function animateMove(now) {
                let progress = Math.min((now - start) / 600, 1);
                camera.position.x = (targetX) * progress;
                camera.position.z = 6 - (9 * progress);

                if (progress < 1) {
                    requestAnimationFrame(animateMove);
                } else {
                    if (isCorrect) {
                        currentStage++;
                        correctGate = Math.random() < 0.5 ? 'blue' : 'red';
                        updateStageVisuals(currentStage);
                        camera.position.set(0, 1.6, 6);
                        isMoving = false;
                    } else {
                        stopTimer();
                        triggerDeathAnimation(() => {
                            showEndModal();
                        });
                    }
                }
            }
            requestAnimationFrame(animateMove);
        }

        function showEndModal() {
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-title').innerText = "GAME OVER";
            document.getElementById('modal-desc').innerHTML = `到達ステージ: <b class="text-cyan-300">Stage ${currentStage + 1}</b><br>タイム: ${(elapsedTime/1000).toFixed(2)}秒`;
            document.getElementById('score-submit-box').classList.remove('hidden');
            document.getElementById('modal-action-btn').innerText = "スコア送信して再挑戦";
            fetchRanking();
        }

        function startNewGame() {
            const nameInput = document.getElementById('player-name-input');
            if (currentStage > 0 && nameInput.value.trim() !== "") {
                submitScore(nameInput.value.trim(), currentStage + 1, elapsedTime);
            }

            currentStage = 0;
            correctGate = Math.random() < 0.5 ? 'blue' : 'red';
            camera.position.set(0, 1.6, 6);
            camera.rotation.set(0, 0, 0);
            entityMesh.position.set(0, 2, -8);
            entityMesh.scale.set(1, 1, 1);
            isMoving = false;

            updateStageVisuals(0);
            startTimer();
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // Listeners
        document.getElementById('modal-action-btn').addEventListener('click', startNewGame);
        document.getElementById('left-touch-zone').addEventListener('click', () => selectGate('blue'));
        document.getElementById('right-touch-zone').addEventListener('click', () => selectGate('red'));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') selectGate('blue');
            if (e.key === 'ArrowRight') selectGate('red');
        });

        // Loop
        function animate(t) {
            requestAnimationFrame(animate);
            if (entityMesh.visible) entityMesh.rotation.y += 0.02;
            renderer.render(scene, camera);
        }

        window.onload = () => {
            fetchRanking();
            animate(0);
        };
    </script>
</body>
</html>
