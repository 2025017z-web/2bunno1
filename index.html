<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
            font-family: 'Noto Sans JP', 'Orbitron', sans-serif;
            overflow: hidden;
            background-color: #030712;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;

            font-family: 'Orbitron', sans-serif;
        }
        /* Custom Neon Glows */
        .glow-blue {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .glow-red {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .box-glow-blue {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .box-glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.3);
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

        }

        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

</head>
<body class="text-white h-screen w-screen relative overflow-hidden select-none">

        <!-- Timer, Fast Mode Toggle & Sound Toggle -->

    <!-- Start / Result / Ranking Overlay Modal -->

            <!-- GAME VIEW TAB -->
            <div id="tab-content-game">
                <!-- Dynamic Icon Header -->

                    </svg>

                    <span>🏆 全世界・最高突破数ランキング</span>
                </h2>
                <p class="text-xs text-gray-400 mb-3">確率の限界を超えた猛者たちの記録。</p>

                <div id="ranking-list-container" class="space-y-2 max-h-64 overflow-y-auto pr-1">

                <button id="refresh-ranking-btn" class="mt-4 w-full py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-mono text-cyan-300 transition-all">
                    🔄 ランキング更新

    <!-- Firebase System Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'probability-warp-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

        let db = null;
        let auth = null;
        let currentUser = null;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            initAuth().catch(err => console.log("Firebase auth fallback:", err));

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    fetchOnlineRankings();
                }
            });
        } catch (e) {
            console.warn("Firebase not fully configured in offline environment:", e);
        }

        window.submitOnlineScore = async function(playerName, streak, timeSec) {
            if (!db || !currentUser) return;
            try {
                const rankingsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rankings');
                await addDoc(rankingsCol, {
                    name: playerName || "名無し探索者",
                    streak: streak,
                    timeSec: timeSec,
                    createdAt: new Date().toISOString(),
                    userId: currentUser.uid
                });
                fetchOnlineRankings();
            } catch (e) {
                console.error("Error submitting score:", e);
            }
        };

        async function fetchOnlineRankings() {
            const container = document.getElementById('ranking-list-container');
            if (!db || !currentUser) {
                container.innerHTML = `<div class="text-center py-6 text-gray-500 text-xs">ランキング機能はオンライン環境で利用可能です。</div>`;
                return;
            }

            try {
                const rankingsCol = collection(db, 'artifacts', appId, 'public', 'data', 'rankings');
                const snapshot = await getDocs(rankingsCol);
                let docs = [];
                snapshot.forEach(doc => {
                    docs.push(doc.data());
                });

                docs.sort((a, b) => {
                    if (b.streak !== a.streak) return b.streak - a.streak;
                    return a.timeSec - b.timeSec;
                });

                const top10 = docs.slice(0, 10);

                if (top10.length === 0) {
                    container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">まだ記録がありません。一番乗りを目指そう！</div>`;
                    return;
                }

                let html = '';
                top10.forEach((item, index) => {
                    let rankBadge = `${index + 1}`;
                    let borderGlow = "border-white/10";
                    let rankColor = "text-gray-400";
                    if (index === 0) { rankBadge = "🥇 1st"; borderGlow = "border-yellow-500/50 bg-yellow-500/10"; rankColor = "text-yellow-400 font-bold"; }
                    else if (index === 1) { rankBadge = "🥈 2nd"; borderGlow = "border-gray-300/40 bg-gray-300/10"; rankColor = "text-gray-200 font-bold"; }
                    else if (index === 2) { rankBadge = "🥉 3rd"; borderGlow = "border-amber-600/40 bg-amber-600/10"; rankColor = "text-amber-400 font-bold"; }

                    const timeStr = formatTimer(item.timeSec || 0);

                    html += `
                        <div class="p-2.5 rounded-xl bg-slate-900/70 border ${borderGlow} flex items-center justify-between text-xs font-mono">
                            <div class="flex items-center gap-2">
                                <span class="w-12 text-center font-orbitron ${rankColor}">${rankBadge}</span>
                                <span class="text-white font-bold max-w-[110px] truncate">${escapeHtml(item.name)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-cyan-300 font-bold font-orbitron text-sm">${item.streak}</span>
                                <span class="text-gray-400 text-[10px]">連勝</span>
                                <span class="text-gray-500 text-[10px] ml-1">(${timeStr})</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (e) {
                console.error("Error fetching rankings:", e);
                container.innerHTML = `<div class="text-center py-6 text-red-400 text-xs">ランキング取得失敗。</div>`;
            }
        }

        window.refreshRankings = fetchOnlineRankings;

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTimer(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
            const ms = Math.floor((totalSec % 1) * 10);
            return `${m}:${s}.${ms}`;
        }
    </script>

    <!-- Main Game Logic Script -->
    <script>
        // --- GAME STATE VARIABLES ---
        let currentStage = 0;
        let bestStreak = parseInt(localStorage.getItem('probability_labyrinth_best') || '0');
        let correctGate = 'blue';
        let isMoving = false;
        let isSoundMuted = false;
        let audioInitialized = false;
        let lastDeathCause = "崖下へ落下";

        // FAST MODE (Dopamine Fast Play Toggle)
        let isFastMode = localStorage.getItem('probability_fast_mode') === 'true';

        // Timer Variables
        let gameStartTime = 0;
        let elapsedPlayTime = 0;
        let timerInterval = null;
        let isTimerRunning = false;

        // Player Name Storage
        let savedPlayerName = localStorage.getItem('probability_player_name') || '';

        // --- EXPANDED LOCATION STAGE THEMES ---
        const STAGE_THEMES = [
            { name: "青と赤の二分決断", locationType: "サイバー空間", fogColor: 0x070b19, bgColor: 0x030712, blueGateColor: 0x00f0ff, redGateColor: 0xff0055, gridColor: 0x1e293b, particlesColor: 0x38bdf8, envType: 'cubes', specialEffect: 'none' },
            { name: "摩天楼ネオン・シティ", locationType: "ハイテク都市", fogColor: 0x0f172a, bgColor: 0x020617, blueGateColor: 0x38bdf8, redGateColor: 0xf43f5e, gridColor: 0x334155, particlesColor: 0x38bdf8, envType: 'city', specialEffect: 'none' },
            { name: "果てしなきネオン砂漠", locationType: "電脳砂漠", fogColor: 0x271a0c, bgColor: 0x120a03, blueGateColor: 0x22d3ee, redGateColor: 0xf97316, gridColor: 0x78350f, particlesColor: 0xfde047, envType: 'desert', specialEffect: 'none' },
            { name: "サンセット・草原回廊", locationType: "黄昏の平原", fogColor: 0x2a0813, bgColor: 0x140308, blueGateColor: 0x38bdf8, redGateColor: 0xf43f5e, gridColor: 0x831843, particlesColor: 0xfbcfe8, envType: 'meadow', specialEffect: 'none' },

        // --- FAST MODE UI INITIALIZATION ---
        function updateFastModeUI() {
            const btn = document.getElementById('fast-mode-btn');
            const text = document.getElementById('fast-mode-text');
            if (isFastMode) {
                btn.classList.add('bg-yellow-500/30', 'border-yellow-400', 'shadow-[0_0_10px_rgba(234,179,8,0.5)]');
                text.innerText = "FAST: ON";
            } else {
                btn.classList.remove('bg-yellow-500/30', 'border-yellow-400', 'shadow-[0_0_10px_rgba(234,179,8,0.5)]');

        }

        document.getElementById('fast-mode-btn').addEventListener('click', () => {
            isFastMode = !isFastMode;
            localStorage.setItem('probability_fast_mode', isFastMode.toString());
            updateFastModeUI();
        });

        // --- ADAPTIVE DOPAMINE SOUND SYSTEM (Tone.js) ---
        let synthBass, synthArp, synthLead, drumKick, drumHiHat, wrongSynth, warpSynth, roarSynth;
        let currentBgmLevel = 0;

        function initAudioEngine() {
            if (audioInitialized) return;
            try {
                Tone.start();

                synthBass = new Tone.MonoSynth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.2 },
                    filterEnvelope: { attack: 0.01, decay: 0.1, sustain: 0.5, baseFrequency: 200, octaves: 3 }
                }).toDestination();
                synthBass.volume.value = -10;

                synthArp = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.15, sustain: 0, release: 0.1 }
                }).toDestination();
                synthArp.volume.value = -14;

                synthLead = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.4 }
                }).toDestination();
                synthLead.volume.value = -12;

                drumKick = new Tone.MembraneSynth().toDestination();
                drumKick.volume.value = -6;

                drumHiHat = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
                    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
                }).toDestination();
                drumHiHat.volume.value = -22;

                wrongSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.6, sustain: 0, release: 0.3 }
                }).toDestination();
                wrongSynth.volume.value = -4;

                warpSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0.1, release: 0.6 }
                }).toDestination();
                warpSynth.volume.value = -8;

                roarSynth = new Tone.NoiseSynth({
                    noise: { type: 'brown' },
                    envelope: { attack: 0.01, decay: 0.8, sustain: 0.1, release: 0.5 }
                }).toDestination();
                roarSynth.volume.value = -2;

                setupBgmLoop();

                Tone.Transport.bpm.value = 124;
                Tone.Transport.start();

                audioInitialized = true;
            } catch (e) {
                console.warn("Audio Context init failed:", e);
            }
        }

        function setupBgmLoop() {
            const notesBass = ["C2", "C2", "Eb2", "F2", "G2", "G2", "Bb2", "C2"];
            const notesArp = ["C4", "Eb4", "G4", "C5", "G4", "Eb4", "Bb4", "D5"];
            const notesLead = ["C5", "G5", "Eb5", "C5", "F5", "D5", "Bb4", "C5"];

            let step = 0;

            Tone.Transport.scheduleRepeat((time) => {
                if (isSoundMuted) return;

                const stage = currentStage;
                if (step % 2 === 0) {
                    synthBass.triggerAttackRelease(notesBass[Math.floor(step / 2) % notesBass.length], "8n", time);
                }
                if (stage >= 2) {
                    synthArp.triggerAttackRelease(notesArp[step % notesArp.length], "16n", time);
                }
                if (stage >= 4) {
                    if (step % 4 === 0) drumKick.triggerAttackRelease("C1", "8n", time);
                    if (step % 2 === 1) drumHiHat.triggerAttackRelease("16n", time);
                }
                if (stage >= 7 && step % 4 === 0) {
                    synthLead.triggerAttackRelease(notesLead[Math.floor(step / 4) % notesLead.length], "4n", time);
                }
                if (stage >= 11) {
                    synthArp.triggerAttackRelease(notesArp[(step * 2) % notesArp.length], "32n", time + 0.05);
                }

                step = (step + 1) % 16;
            }, "16n");
        }

        function updateAdaptiveMusic(stage) {
            if (!audioInitialized) return;
            const newBpm = Math.min(124 + stage * 3, 175);
            Tone.Transport.bpm.rampTo(newBpm, 1);

            let bgmLv = 1;
            if (stage >= 11) bgmLv = 5;
            else if (stage >= 7) bgmLv = 4;
            else if (stage >= 4) bgmLv = 3;
            else if (stage >= 2) bgmLv = 2;

            currentBgmLevel = bgmLv;
            document.getElementById('bgm-level-badge').innerText = `BGM LV.${bgmLv} (${Math.round(newBpm)} BPM)`;
        }

        function playSoundSFX(type) {
            if (isSoundMuted || !audioInitialized) return;
            try {
                const now = Tone.now();
                if (type === 'correct') {
                    const leadNotes = ["C5", "E5", "G5", "C6"];
                    leadNotes.forEach((note, i) => {
                        synthLead.triggerAttackRelease(note, "16n", now + i * 0.05);
                    });
                } else if (type === 'wrong') {
                    wrongSynth.triggerAttackRelease("F1", "4n", now);
                } else if (type === 'warp') {
                    warpSynth.triggerAttackRelease("C2", "4n", now);
                } else if (type === 'roar') {
                    roarSynth.triggerAttackRelease("2n", now);
                }
            } catch (e) {}
        }

        // --- THREE.JS ENGINE & SCENE SETUP ---
        const container = document.getElementById('canvas-container');

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);

        const particleCount = 250;

        const environmentGroup = new THREE.Group();

        function buildWeirdCreature() {
            while(creatureGroup.children.length > 0){ creatureGroup.remove(creatureGroup.children[0]); }

            const pupilGeom = new THREE.SphereGeometry(0.25, 16, 16);

        buildWeirdCreature();

        function buildEnvironmentForTheme(type) {
            environmentMeshes.forEach(mesh => environmentGroup.remove(mesh));
            environmentMeshes = [];

            const matWire = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.35 });

            if (type === 'city') {
                for (let i = 0; i < 30; i++) {
                    const h = Math.random() * 15 + 5;
                    const geom = new THREE.BoxGeometry(2, h, 2);
                    const mesh = new THREE.Mesh(geom, matWire);
                    const x = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 12 + 5);
                    const z = (Math.random() - 0.5) * 40 - 5;
                    mesh.position.set(x, h / 2, z);
                    environmentGroup.add(mesh);
                    environmentMeshes.push(mesh);
                }
            } else if (type === 'desert' || type === 'pyramids') {
                for (let i = 0; i < 12; i++) {
                    const size = Math.random() * 8 + 4;
                    const geom = new THREE.ConeGeometry(size, size, 4);
                    const mesh = new THREE.Mesh(geom, matWire);
                    const x = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 16 + 6);
                    const z = (Math.random() - 0.5) * 50 - 5;
                    mesh.position.set(x, size / 2, z);
                    environmentGroup.add(mesh);
                    environmentMeshes.push(mesh);
                }
            } else if (type === 'meadow') {
                for (let i = 0; i < 20; i++) {
                    const geom = new THREE.DodecahedronGeometry(Math.random() * 2 + 1);
                    const mesh = new THREE.Mesh(geom, matWire);
                    mesh.position.set((Math.random() - 0.5) * 35, Math.random() * 8 + 1, (Math.random() - 0.5) * 40 - 5);
                    environmentGroup.add(mesh);
                    environmentMeshes.push(mesh);
                }
            } else if (type === 'crystals') {
                for (let i = 0; i < 25; i++) {
                    const geom = new THREE.OctahedronGeometry(Math.random() * 1.5 + 0.8);
                    const mesh = new THREE.Mesh(geom, matWire);
                    mesh.position.set((Math.random() - 0.5) * 30, Math.random() * 10 + 0.5, (Math.random() - 0.5) * 40 - 5);
                    environmentGroup.add(mesh);
                    environmentMeshes.push(mesh);
                }
            } else if (type === 'torii') {
                for (let i = 0; i < 6; i++) {
                    const frameGroup = new THREE.Group();
                    const pGeom = new THREE.BoxGeometry(0.4, 5, 0.4);
                    const p1 = new THREE.Mesh(pGeom, matWire); p1.position.x = -2;
                    const p2 = new THREE.Mesh(pGeom, matWire); p2.position.x = 2;
                    const topG = new THREE.Mesh(new THREE.BoxGeometry(5, 0.5, 0.5), matWire); topG.position.y = 2.5;
                    frameGroup.add(p1, p2, topG);
                    frameGroup.position.set(0, 2.5, -i * 8 - 8);
                    environmentGroup.add(frameGroup);
                    environmentMeshes.push(frameGroup);
                }
            } else {
                for (let i = 0; i < 25; i++) {
                    const geom = type === 'spheres' ? new THREE.IcosahedronGeometry(0.8, 0) : new THREE.BoxGeometry(1, 1, 1);
                    const mesh = new THREE.Mesh(geom, matWire);
                    mesh.position.set((Math.random() - 0.5) * 30, Math.random() * 10 + 1, (Math.random() - 0.5) * 40 - 5);
                    environmentGroup.add(mesh);
                    environmentMeshes.push(mesh);
                }
            }
        }

        function createGateMesh(glowColorHex) {
            const group = new THREE.Group();
            const archShape = new THREE.BoxGeometry(0.4, 4.5, 0.4);
            const topArchShape = new THREE.BoxGeometry(3.2, 0.4, 0.4);

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2, metalness: 0.8 });

            const leftPillar = new THREE.Mesh(archShape, frameMat);
            leftPillar.position.set(-1.4, 2.25, 0);

            const rightPillar = new THREE.Mesh(archShape, frameMat);
            rightPillar.position.set(1.4, 2.25, 0);

            const topBar = new THREE.Mesh(topArchShape, frameMat);
            topBar.position.set(0, 4.3, 0);

            group.add(leftPillar, rightPillar, topBar);

            const portalGeom = new THREE.PlaneGeometry(2.4, 4.1);
            const portalMat = new THREE.MeshBasicMaterial({ color: glowColorHex, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
            const portalPlane = new THREE.Mesh(portalGeom, portalMat);
            portalPlane.position.set(0, 2.1, 0);
            group.add(portalPlane);

            const borderGeom = new THREE.BoxGeometry(2.6, 4.3, 0.1);
            const borderEdges = new THREE.EdgesGeometry(borderGeom);
            const borderMat = new THREE.LineBasicMaterial({ color: glowColorHex, linewidth: 2 });
            const borderLines = new THREE.LineSegments(borderEdges, borderMat);
            borderLines.position.set(0, 2.15, 0);
            group.add(borderLines);

            return { group, portalMat, borderMat };
        }

        const leftGateObj = createGateMesh(STAGE_THEMES[0].blueGateColor);
        leftGateObj.group.position.set(-2.5, 0, -2);
        scene.add(leftGateObj.group);

        const rightGateObj = createGateMesh(STAGE_THEMES[0].redGateColor);
        rightGateObj.group.position.set(2.5, 0, -2);
        scene.add(rightGateObj.group);

        buildEnvironmentForTheme(STAGE_THEMES[0].envType);

        function randomizeGate() {
            correctGate = Math.random() < 0.5 ? 'blue' : 'red';
        }

        function updateStageVisuals(stageIdx) {
            const theme = STAGE_THEMES[stageIdx % STAGE_THEMES.length];

            scene.fog.color.setHex(theme.fogColor);
            renderer.setClearColor(theme.bgColor);

            leftGateObj.portalMat.color.setHex(theme.blueGateColor);
            leftGateObj.borderMat.color.setHex(theme.blueGateColor);
            blueGateLight.color.setHex(theme.blueGateColor);

            rightGateObj.portalMat.color.setHex(theme.redGateColor);
            rightGateObj.borderMat.color.setHex(theme.redGateColor);

                ceilingGridHelper.visible = true;
                ceilingGridHelper.material.color.setHex(theme.redGateColor);

                ceilingGridHelper.visible = false;
            }

            creatureGroup.visible = (theme.specialEffect === 'creature');
            creatureGroup.position.set(0, 3.5, -6);
            creatureGroup.scale.set(1, 1, 1);

            buildEnvironmentForTheme(theme.envType);

            document.getElementById('stage-title-hud').innerText = `STAGE ${stageIdx + 1} - ${theme.name}`;
            document.getElementById('hud-location-name').innerText = theme.locationType;
            document.getElementById('current-streak-val').innerText = `${stageIdx} 回`;
            document.getElementById('best-streak-val').innerText = `${bestStreak} 回`;

            updateAdaptiveMusic(stageIdx);

            const denominatorBig = Math.pow(2, stageIdx + 1);
            let displayDenom = denominatorBig.toLocaleString();
            let displayPercent = (100 / denominatorBig);

            if (stageIdx >= 30) {
                displayDenom = "2^" + (stageIdx + 1);
                displayPercent = "0.0000...%";
            } else {
                displayPercent = displayPercent.toFixed(Math.min(stageIdx + 3, 8)) + "%";
            }
            
            document.getElementById('prob-denominator').innerText = displayDenom;
            document.getElementById('prob-percent').innerText = displayPercent;
        }

        function startPlayTimer() {
            gameStartTime = performance.now();
            isTimerRunning = true;
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (!isTimerRunning) return;
                elapsedPlayTime = (performance.now() - gameStartTime) / 1000;
                document.getElementById('hud-timer-val').innerText = formatTimer(elapsedPlayTime);
            }, 100);
        }

        function stopPlayTimer() {
            isTimerRunning = false;
            if (timerInterval) clearInterval(timerInterval);
        }

        function formatTimer(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
            const ms = Math.floor((totalSec % 1) * 10);
            return `${m}:${s}.${ms}`;
        }

        // --- GATE CHOICE ACTION ---
        function selectGate(chosenColor) {
            if (isMoving) return;
            isMoving = true;
            initAudioEngine();

            const isCorrect = (chosenColor === correctGate);

            // FAST MODE: スキップ処理
            if (isFastMode) {
                playSoundSFX('warp');
                handleGateOutcome(isCorrect, chosenColor);
                return;
            }

            const targetX = chosenColor === 'blue' ? -2.5 : 2.5;
            let startTime = performance.now();
            const startCameraX = camera.position.x;
            const startCameraZ = camera.position.z;

            playSoundSFX('warp');

            function animateCamera(now) {
                const elapsed = (now - startTime) / 1000;
                const duration = 0.7;
                const progress = Math.min(elapsed / duration, 1);

                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

                camera.position.x = startCameraX + (targetX - startCameraX) * ease;
                camera.position.z = startCameraZ + (-3 - startCameraZ) * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                } else {
                    handleGateOutcome(isCorrect, chosenColor);
                }
            }

            requestAnimationFrame(animateCamera);
        }

        function handleGateOutcome(isCorrect, chosenColor) {
            if (isCorrect) {
                playSoundSFX('correct');
                currentStage++;
                
                if (currentStage > bestStreak) {
                    bestStreak = currentStage;
                    localStorage.setItem('probability_labyrinth_best', bestStreak.toString());
                }

                randomizeGate();
                updateStageVisuals(currentStage);

                camera.position.set(0, 1.6, 6);
                camera.rotation.set(0, 0, 0);
                camera.fov = 65;
                camera.updateProjectionMatrix();
                isMoving = false;
            } else {
                stopPlayTimer();
                triggerDeathAnimation(chosenColor);
            }
        }

        // --- EXPANDED DEATH ANIMATION SYSTEM (9 VARIANTS) ---
        function triggerDeathAnimation(chosenColor) {
            playSoundSFX('wrong');
            const theme = STAGE_THEMES[currentStage % STAGE_THEMES.length];
            
            // Expanded death types
            let deathTypes = ['fall', 'fissure', 'crush', 'laser', 'freeze', 'explosion', 'spin_warp', 'glitch'];
            if (theme.specialEffect === 'creature') {
                deathTypes.push('eat', 'eat');
            }

            const deathType = deathTypes[Math.floor(Math.random() * deathTypes.length)];

            if (deathType === 'fall') lastDeathCause = "底なしの崖へ落下";
            else if (deathType === 'eat') { lastDeathCause = "謎の変な奴に捕食された"; playSoundSFX('roar'); creatureGroup.visible = true; }
            else if (deathType === 'fissure') lastDeathCause = "次元の裂け目に飲まれた";
            else if (deathType === 'crush') lastDeathCause = "空間圧縮により粉砕";
            else if (deathType === 'laser') lastDeathCause = "トラップレーザーにより消滅";
            else if (deathType === 'freeze') lastDeathCause = "絶対零度の氷結バリアに触れ凍結";
            else if (deathType === 'explosion') lastDeathCause = "ゲート過負荷爆発に巻き込まれた";
            else if (deathType === 'spin_warp') lastDeathCause = "位相錯乱スパイラルに呑み込まれた";
            else if (deathType === 'glitch') lastDeathCause = "次元バグ（グリッチ）により存在消滅";

            // FAST MODE: 即座にダイアログを表示
            if (isFastMode) {
                finishDeathProcess();
                return;
            }

            let deathDuration = 1.2;
            let startTime = performance.now();

            function playDeathFrame(now) {
                const elapsed = (now - startTime) / 1000;
                const progress = Math.min(elapsed / deathDuration, 1);

                if (deathType === 'fall') {
                    camera.position.y = 1.6 - (progress * progress * 20);
                    camera.rotation.x = -progress * 1.2;
                } else if (deathType === 'eat') {
                    creatureGroup.position.set(camera.position.x, 1.6, camera.position.z - (1 - progress) * 5);
                    const scale = 1 + progress * 8;
                    creatureGroup.scale.set(scale, scale, scale);
                } else if (deathType === 'fissure') {
                    gridHelper.position.x = (progress * 10) * (chosenColor === 'blue' ? -1 : 1);
                    camera.position.y = 1.6 - progress * 10;
                } else if (deathType === 'crush') {
                    camera.fov = 65 + progress * 80;
                    camera.updateProjectionMatrix();
                    camera.rotation.z = progress * Math.PI * 2;
                } else if (deathType === 'laser') {
                    renderer.setClearColor(0xff0033);
                } else if (deathType === 'freeze') {
                    renderer.setClearColor(0x0088ff);
                    camera.position.z = 6 + progress * 2;
                } else if (deathType === 'explosion') {
                    camera.position.x = (Math.random() - 0.5) * progress * 2;
                    camera.position.y = 1.6 + (Math.random() - 0.5) * progress * 2;
                    renderer.setClearColor((Math.floor(progress * 20) % 2 === 0) ? 0xffffff : 0xff3300);
                } else if (deathType === 'spin_warp') {
                    camera.rotation.z = progress * Math.PI * 6;
                    camera.position.z = 6 + progress * 10;
                } else if (deathType === 'glitch') {
                    camera.position.x = (Math.random() - 0.5) * 3;
                    camera.position.y = 1.6 + (Math.random() - 0.5) * 3;
                    camera.fov = 30 + Math.random() * 80;
                    camera.updateProjectionMatrix();
                }

                if (progress < 1) {
                    requestAnimationFrame(playDeathFrame);
                } else {
                    finishDeathProcess();
                }
            }

            requestAnimationFrame(playDeathFrame);
        }

        function finishDeathProcess() {
            renderer.setClearColor(0x000000);
            const nameInput = document.getElementById('player-name-input').value.trim();
            if (nameInput) {
                localStorage.setItem('probability_player_name', nameInput);
            }
            if (window.submitOnlineScore) {
                window.submitOnlineScore(nameInput || "名無し探索者", currentStage, elapsedPlayTime);
            }
            showGameEndModal(false);
        }

        // --- MODAL & UI TAB HANDLERS ---
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalStats = document.getElementById('modal-stats');
        const modalActionBtn = document.getElementById('modal-action-btn');

        const iconStart = document.getElementById('modal-icon-start');
        const iconFail = document.getElementById('modal-icon-fail');

        const tabGameBtn = document.getElementById('tab-btn-game');
        const tabRankingBtn = document.getElementById('tab-btn-ranking');
        const tabContentGame = document.getElementById('tab-content-game');
        const tabContentRanking = document.getElementById('tab-content-ranking');

        tabGameBtn.addEventListener('click', () => {
            tabGameBtn.className = "flex-1 py-2 rounded-xl font-orbitron font-bold text-xs md:text-sm transition-all bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md";
            tabRankingBtn.className = "flex-1 py-2 rounded-xl font-orbitron font-bold text-xs md:text-sm transition-all text-gray-400 hover:text-white";
            tabContentGame.classList.remove('hidden');
            tabContentRanking.classList.add('hidden');
        });

        tabRankingBtn.addEventListener('click', () => {
            tabRankingBtn.className = "flex-1 py-2 rounded-xl font-orbitron font-bold text-xs md:text-sm transition-all bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md";
            tabGameBtn.className = "flex-1 py-2 rounded-xl font-orbitron font-bold text-xs md:text-sm transition-all text-gray-400 hover:text-white";
            tabContentRanking.classList.remove('hidden');
            tabContentGame.classList.add('hidden');
            if (window.refreshRankings) window.refreshRankings();
        });

        document.getElementById('refresh-ranking-btn').addEventListener('click', () => {
            if (window.refreshRankings) window.refreshRankings();
        });

        function showGameEndModal(isStart) {
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            iconStart.classList.add('hidden');
            iconFail.classList.add('hidden');

            document.getElementById('player-name-input').value = savedPlayerName;

            if (isStart) {
                modalStats.classList.add('hidden');
                modalTitle.innerText = "確率の迷宮";
                modalTitle.className = "text-2xl md:text-3xl font-black font-orbitron tracking-wide mb-1 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-blue-300";
                modalDesc.innerHTML = `1/2の選択を当て続けろ！<br>右上の <b>⚡ FAST</b> をオンにすると全演出カットで爆速連打が可能！`;
                iconStart.classList.remove('hidden');
                modalActionBtn.innerText = "CHALLENGE START";
            } else {
                modalStats.classList.remove('hidden');
                document.getElementById('stat-stage').innerText = `${currentStage} 回連続成功`;
                
                const denom = Math.pow(2, currentStage).toLocaleString();
                document.getElementById('stat-prob').innerText = `1 / ${denom}`;
                document.getElementById('stat-time').innerText = formatTimer(elapsedPlayTime);
                document.getElementById('stat-cause').innerText = lastDeathCause;
                document.getElementById('stat-best').innerText = `${bestStreak} 回連続成功`;

                modalTitle.innerText = "PROBABILITY FAILED";
                modalTitle.className = "text-2xl md:text-3xl font-black font-orbitron tracking-wide mb-1 text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-pink-300 to-white glow-red";
                modalDesc.innerHTML = `<span class="text-red-400 font-bold">ハズレのゲートを選択しました。</span><br>スコアがオンラインランキングに保存されました！`;
                iconFail.classList.remove('hidden');
                modalActionBtn.innerText = "RETRY CHALLENGE [Space / Enter]";
            }
        }

        function startNewGame() {
            currentStage = 0;
            isMoving = false;

            const nameVal = document.getElementById('player-name-input').value.trim();
            if (nameVal) {
                savedPlayerName = nameVal;
                localStorage.setItem('probability_player_name', savedPlayerName);
            }

            camera.position.set(0, 1.6, 6);
            camera.rotation.set(0, 0, 0);
            camera.fov = 65;
            camera.updateProjectionMatrix();

            randomizeGate();
            updateStageVisuals(0);

            startPlayTimer();

            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        // Event Listeners
        document.getElementById('modal-action-btn').addEventListener('click', () => {
            initAudioEngine();
            startNewGame();
        });

        document.getElementById('left-touch-zone').addEventListener('click', () => selectGate('blue'));
        document.getElementById('right-touch-zone').addEventListener('click', () => selectGate('red'));

        window.addEventListener('keydown', (e) => {
            if (modalOverlay.classList.contains('pointer-events-none')) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    selectGate('blue');
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    selectGate('red');
                }
            } else if (e.key === 'Enter' || e.key === ' ') {
                startNewGame();
            }
        });

        document.getElementById('sound-btn').addEventListener('click', () => {
            initAudioEngine();
            isSoundMuted = !isSoundMuted;
            document.getElementById('sound-icon-on').classList.toggle('hidden', isSoundMuted);
            document.getElementById('sound-icon-off').classList.toggle('hidden', isSoundMuted);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN ANIMATION RENDER LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001;

            leftGateObj.group.position.y = Math.sin(t * 2) * 0.08;
            rightGateObj.group.position.y = Math.sin(t * 2 + 1) * 0.08;

            if (creatureGroup.visible) {
                creatureGroup.position.y = 3.5 + Math.sin(t * 3) * 0.3;
                if (creatureCoreMesh) {
                    creatureCoreMesh.rotation.x = t * 1.5;
                    creatureCoreMesh.rotation.y = t * 2.0;
                }
                if (creatureEyeMesh) {
                    creatureEyeMesh.lookAt(camera.position);
                }
            }

            environmentMeshes.forEach((mesh, idx) => {
                mesh.rotation.y += 0.003 * (idx % 2 === 0 ? 1 : -1);
            });

            const positions = particleGeometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] -= 0.02;
                if (positions[i] < 0) positions[i] = 20;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            document.getElementById('best-streak-val').innerText = `${bestStreak} 回`;
            updateFastModeUI();
            randomizeGate();
            updateStageVisuals(0);
            showGameEndModal(true);
            animate(0);
        };
    </script>
</body>
</html>
