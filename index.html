<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>確率の迷宮 - Probability Warp</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', 'Orbitron', sans-serif;
            overflow: hidden;
            background-color: #030712;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom Neon Glows */
        .glow-blue {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .glow-red {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .glow-gold {
            text-shadow: 0 0 12px rgba(234, 179, 8, 0.9), 0 0 25px rgba(234, 179, 8, 0.6);
        }
        .box-glow-blue {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .box-glow-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.3);
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Pulse Animation */
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative overflow-hidden select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HUD Header: Title & Sound Toggle -->
    <div class="absolute top-0 left-0 right-0 z-10 p-4 md:p-6 flex justify-between items-center pointer-events-none">
        <!-- Title & Stage Status -->
        <div class="pointer-events-auto flex items-center gap-3">
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="stage-title-hud" class="font-orbitron text-xs md:text-sm font-bold tracking-widest text-cyan-300 uppercase">
                    STAGE 1 - 青と赤の二分決断
                </span>
            </div>
        </div>

        <!-- Mute/Sound Toggle -->
        <button id="sound-btn" class="pointer-events-auto glass-panel p-3 rounded-2xl hover:bg-white/10 transition-all flex items-center justify-center">
            <svg id="sound-icon-on" class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
            <svg id="sound-icon-off" class="w-5 h-5 text-gray-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/>
                <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <!-- Top Score Info Bar -->
    <div class="absolute top-16 md:top-20 left-1/2 -translate-x-1/2 z-10 w-11/12 max-w-md pointer-events-none">
        <div class="flex justify-between items-center glass-panel px-5 py-2 rounded-full text-xs font-mono">
            <div>
                <span class="text-gray-400">連続突破数: </span>
                <span id="current-streak-val" class="text-cyan-300 font-bold font-orbitron text-sm">0 回</span>
            </div>
            <div>
                <span class="text-gray-400">最高記録: </span>
                <span id="best-streak-val" class="text-yellow-400 font-bold font-orbitron text-sm">0 回</span>
            </div>
        </div>
    </div>

    <!-- Interactive Controls (Left / Right Gate Touch & Buttons) -->
    <div id="controls-container" class="absolute inset-0 z-10 flex pointer-events-none">
        <!-- Left Choice (Blue Gate) -->
        <div id="left-touch-zone" class="w-1/2 h-full pointer-events-auto cursor-pointer group flex items-end pb-32 md:pb-36 justify-center">
            <button id="btn-blue" class="glass-panel border-blue-500/50 box-glow-blue hover:bg-blue-600/30 text-blue-300 font-bold px-6 py-3 rounded-2xl transition-all duration-300 transform group-hover:scale-105 active:scale-95 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-blue-400 shadow-[0_0_8px_#60a5fa]"></span>
                <span class="font-orbitron tracking-wider">青のゲート [←]</span>
            </button>
        </div>
        <!-- Right Choice (Red Gate) -->
        <div id="right-touch-zone" class="w-1/2 h-full pointer-events-auto cursor-pointer group flex items-end pb-32 md:pb-36 justify-center">
            <button id="btn-red" class="glass-panel border-red-500/50 box-glow-red hover:bg-red-600/30 text-red-300 font-bold px-6 py-3 rounded-2xl transition-all duration-300 transform group-hover:scale-105 active:scale-95 flex items-center gap-2">
                <span class="font-orbitron tracking-wider">赤のゲート [→]</span>
                <span class="w-3 h-3 rounded-full bg-red-400 shadow-[0_0_8px_#f87171]"></span>
            </button>
        </div>
    </div>

    <!-- Bottom HUD: Probability Tracker -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 w-11/12 max-w-lg pointer-events-none">
        <div class="glass-panel rounded-3xl p-4 md:p-5 text-center shadow-2xl border border-white/10 relative overflow-hidden">
            <!-- Ambient Background Glow -->
            <div id="hud-glow-bg" class="absolute -inset-1 bg-gradient-to-r from-cyan-500/10 via-purple-500/10 to-pink-500/10 rounded-3xl blur-xl transition-all duration-700"></div>

            <div class="relative z-10">
                <div class="text-xs uppercase tracking-widest text-gray-400 font-medium mb-1">現在の到達確率</div>
                
                <!-- Main Probability Value Display -->
                <div class="flex items-center justify-center gap-2">
                    <span class="text-sm text-cyan-400 font-orbitron">1 /</span>
                    <span id="prob-denominator" class="text-3xl md:text-5xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-teal-200 to-white glow-blue">
                        2
                    </span>
                </div>

                <!-- Detail Percent Info -->
                <div class="mt-2 flex items-center justify-between text-xs font-mono text-gray-300 px-2 pt-2 border-t border-white/10">
                    <div>
                        <span class="text-gray-500">パーセンテージ:</span>
                        <span id="prob-percent" class="text-cyan-300 font-bold">50.000%</span>
                    </div>
                    <div>
                        <span class="text-gray-500">モード:</span>
                        <span class="text-purple-400 font-bold">無限迷宮</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start / Result Overlay Modal -->
    <div id="modal-overlay" class="absolute inset-0 z-30 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-500">
        <div id="modal-card" class="glass-panel max-w-md w-full rounded-3xl p-6 md:p-8 text-center relative border border-white/20 shadow-2xl transform transition-all duration-500 scale-100">
            
            <!-- Dynamic Icon Header -->
            <div id="modal-icon-container" class="w-20 h-20 mx-auto mb-4 rounded-full bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center animate-pulse-slow">
                <svg id="modal-icon-start" class="w-10 h-10 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <svg id="modal-icon-fail" class="w-10 h-10 text-red-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <!-- Modal Title -->
            <h1 id="modal-title" class="text-2xl md:text-3xl font-black font-orbitron tracking-wide mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-blue-300">
                確率の迷宮
            </h1>

            <!-- Subtitle Description -->
            <p id="modal-desc" class="text-gray-300 text-sm md:text-base leading-relaxed mb-6 font-light">
                2分の1の運命選択を当て続けろ！<br>
                どこまで連続で正解できるか限界に挑戦。<br>
                迷宮を進むたびに、奇妙な世界があなたを待つ。
            </p>

            <!-- Stats Box -->
            <div id="modal-stats" class="hidden mb-6 p-4 rounded-2xl bg-white/5 border border-white/10 text-left text-xs font-mono space-y-2">
                <div class="flex justify-between">
                    <span class="text-gray-400">今回連続成功:</span>
                    <span id="stat-stage" class="text-cyan-300 font-bold">0 回</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">突破した確率:</span>
                    <span id="stat-prob" class="text-yellow-300 font-bold">1 / 1</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">死因:</span>
                    <span id="stat-cause" class="text-red-400 font-bold">崖下へ落下</span>
                </div>
                <div class="flex justify-between border-t border-white/10 pt-2">
                    <span class="text-gray-400">最高記録:</span>
                    <span id="stat-best" class="text-emerald-400 font-bold">0 回</span>
                </div>
            </div>

            <!-- Action Button -->
            <button id="modal-action-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 font-orbitron font-bold text-lg tracking-wider text-white shadow-lg shadow-cyan-500/30 transition-all duration-300 transform hover:scale-[1.02] active:scale-98">
                CHALLENGE START
            </button>
        </div>
    </div>

    <script>
        // --- GAME CONFIGURATION & STATE ---
        let currentStage = 0; // 0, 1, 2, ...
        let bestStreak = parseInt(localStorage.getItem('probability_labyrinth_best') || '0');
        let correctGate = 'blue'; // 'blue' or 'red'
        let isMoving = false;
        let isSoundMuted = false;
        let audioInitialized = false;
        let lastDeathCause = "崖下へ落下";

        // Stage Themes configuration
        const STAGE_THEMES = [
            {
                name: "青と赤の二分決断",
                fogColor: 0x070b19,
                bgColor: 0x030712,
                blueGateColor: 0x00f0ff,
                redGateColor: 0xff0055,
                gridColor: 0x1e293b,
                particlesColor: 0x38bdf8,
                geometryType: 'cubes',
                specialEffect: 'none'
            },
            {
                name: "鏡の世界 (MIRROR WORLD)",
                fogColor: 0x101528,
                bgColor: 0x080c18,
                blueGateColor: 0x38bdf8,
                redGateColor: 0xe879f9,
                gridColor: 0x475569,
                particlesColor: 0xe2e8f0,
                geometryType: 'octahedrons',
                specialEffect: 'mirror'
            },
            {
                name: "変な奴がいる異次元 (UNKNOWN ENTITY)",
                fogColor: 0x1d0029,
                bgColor: 0x0b0012,
                blueGateColor: 0x00ffaa,
                redGateColor: 0xff00aa,
                gridColor: 0x581c87,
                particlesColor: 0xa855f7,
                geometryType: 'spheres',
                specialEffect: 'creature'
            },
            {
                name: "マトリックス・デジタル",
                fogColor: 0x022c22,
                bgColor: 0x021712,
                blueGateColor: 0x00ff88,
                redGateColor: 0xff3300,
                gridColor: 0x065f46,
                particlesColor: 0x34d399,
                geometryType: 'pyramids',
                specialEffect: 'none'
            },
            {
                name: "ステラ・星雲空間",
                fogColor: 0x18002e,
                bgColor: 0x0a0014,
                blueGateColor: 0x818cf8,
                redGateColor: 0xf43f5e,
                gridColor: 0x4c1d95,
                particlesColor: 0xc084fc,
                geometryType: 'spheres',
                specialEffect: 'none'
            },
            {
                name: "ヴォルカニック・コア",
                fogColor: 0x2e0800,
                bgColor: 0x140300,
                blueGateColor: 0x38bdf8,
                redGateColor: 0xff4500,
                gridColor: 0x7c2d12,
                particlesColor: 0xfb923c,
                geometryType: 'cubes',
                specialEffect: 'none'
            },
            {
                name: "クリスタル・氷結領域",
                fogColor: 0x042f2e,
                bgColor: 0x021e1d,
                blueGateColor: 0x22d3ee,
                redGateColor: 0xf472b6,
                gridColor: 0x115e59,
                particlesColor: 0x67e8f9,
                geometryType: 'octahedrons',
                specialEffect: 'none'
            },
            {
                name: "レトロ・シンスウェーブ",
                fogColor: 0x310022,
                bgColor: 0x15000e,
                blueGateColor: 0x06b6d4,
                redGateColor: 0xff007f,
                gridColor: 0x831843,
                particlesColor: 0xf472b6,
                geometryType: 'pyramids',
                specialEffect: 'none'
            },
            {
                name: "黄金の聖域 (GOLD SANCTUARY)",
                fogColor: 0x291d00,
                bgColor: 0x120d00,
                blueGateColor: 0x38bdf8,
                redGateColor: 0xeab308,
                gridColor: 0x713f12,
                particlesColor: 0xfde047,
                geometryType: 'pyramids',
                specialEffect: 'none'
            },
            {
                name: "カオス・ブラックホール",
                fogColor: 0x1f0000,
                bgColor: 0x0a0000,
                blueGateColor: 0x00ffff,
                redGateColor: 0xff0000,
                gridColor: 0x7f1d1d,
                particlesColor: 0xff8800,
                geometryType: 'cubes',
                specialEffect: 'creature'
            }
        ];

        // --- AUDIO SYNTHESIS (Tone.js) ---
        let correctSynth, wrongSynth, warpSynth, roarSynth;

        function initAudio() {
            if (audioInitialized) return;
            try {
                Tone.start();
                
                correctSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 }
                }).toDestination();
                correctSynth.volume.value = -6;

                wrongSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.6, sustain: 0, release: 0.3 }
                }).toDestination();
                wrongSynth.volume.value = -3;

                warpSynth = new Tone.MonoSynth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.1, decay: 0.5, sustain: 0.2, release: 0.8 }
                }).toDestination();
                warpSynth.volume.value = -10;

                roarSynth = new Tone.NoiseSynth({
                    noise: { type: 'brown' },
                    envelope: { attack: 0.01, decay: 0.8, sustain: 0.1, release: 0.5 }
                }).toDestination();
                roarSynth.volume.value = -2;

                audioInitialized = true;
            } catch (e) {
                console.warn("Audio Context init failed:", e);
            }
        }

        function playSound(type) {
            if (isSoundMuted || !audioInitialized) return;
            try {
                const now = Tone.now();
                if (type === 'correct') {
                    correctSynth.triggerAttackRelease(["E5", "B5", "E6"], "16n", now);
                } else if (type === 'wrong') {
                    wrongSynth.triggerAttackRelease("G1", "4n", now);
                } else if (type === 'warp') {
                    warpSynth.triggerAttackRelease("C3", "4n", now);
                } else if (type === 'roar') {
                    roarSynth.triggerAttackRelease("2n", now);
                }
            } catch (e) {
                // Ignore audio trigger errors
            }
        }

        // --- THREE.JS ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(STAGE_THEMES[0].fogColor, 0.035);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const blueGateLight = new THREE.PointLight(0x00f0ff, 3, 15);
        blueGateLight.position.set(-2.5, 2, 0);
        scene.add(blueGateLight);

        const redGateLight = new THREE.PointLight(0xff0055, 3, 15);
        redGateLight.position.set(2.5, 2, 0);
        scene.add(redGateLight);

        // Floor Grid & Ceiling Grid (for mirror world)
        let gridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1e293b);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        let ceilingGridHelper = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1e293b);
        ceilingGridHelper.position.y = 12;
        ceilingGridHelper.visible = false;
        scene.add(ceilingGridHelper);

        // Floating Background Particles
        const particleCount = 200;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 40;
            particlePositions[i + 1] = Math.random() * 20;
            particlePositions[i + 2] = (Math.random() - 0.5) * 60;
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: 0x38bdf8,
            size: 0.15,
            transparent: true,
            opacity: 0.8
        });
        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Floating Stage Geometries Container
        const floatingGroup = new THREE.Group();
        scene.add(floatingGroup);
        let floatingMeshes = [];

        // Special Weird Creature Group ("変な奴")
        const creatureGroup = new THREE.Group();
        creatureGroup.position.set(0, 3.5, -6);
        scene.add(creatureGroup);
        let creatureCoreMesh, creatureEyeMesh;

        function buildWeirdCreature() {
            while(creatureGroup.children.length > 0){ 
                creatureGroup.remove(creatureGroup.children[0]); 
            }
            // Weird Pulsing Spiky Core
            const coreGeom = new THREE.IcosahedronGeometry(1.4, 1);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0xff00bb,
                wireframe: true,
                emissive: 0xaa00aa,
                roughness: 0.1
            });
            creatureCoreMesh = new THREE.Mesh(coreGeom, coreMat);
            creatureGroup.add(creatureCoreMesh);

            // Eyeball in center
            const eyeGeom = new THREE.SphereGeometry(0.6, 16, 16);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            creatureEyeMesh = new THREE.Mesh(eyeGeom, eyeMat);

            const pupilGeom = new THREE.SphereGeometry(0.25, 16, 16);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const pupil = new THREE.Mesh(pupilGeom, pupilMat);
            pupil.position.z = 0.5;
            creatureEyeMesh.add(pupil);

            creatureGroup.add(creatureEyeMesh);
        }
        buildWeirdCreature();
        creatureGroup.visible = false;

        function createFloatingEnvironment(type) {
            floatingMeshes.forEach(mesh => floatingGroup.remove(mesh));
            floatingMeshes = [];

            let geom;
            if (type === 'cubes') geom = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            else if (type === 'pyramids') geom = new THREE.ConeGeometry(0.6, 1, 4);
            else if (type === 'spheres') geom = new THREE.IcosahedronGeometry(0.6, 0);
            else geom = new THREE.OctahedronGeometry(0.7);

            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.4
            });

            for (let i = 0; i < 25; i++) {
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 30,
                    Math.random() * 12 + 1,
                    (Math.random() - 0.5) * 40 - 10
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                floatingGroup.add(mesh);
                floatingMeshes.push(mesh);
            }
        }

        // --- GATE GENERATION ---
        function createGateMesh(glowColorHex) {
            const group = new THREE.Group();

            const archShape = new THREE.BoxGeometry(0.4, 4.5, 0.4);
            const topArchShape = new THREE.BoxGeometry(3.2, 0.4, 0.4);

            const frameMat = new THREE.MeshStandardMaterial({
                color: 0x111827,
                roughness: 0.2,
                metalness: 0.8
            });

            const leftPillar = new THREE.Mesh(archShape, frameMat);
            leftPillar.position.set(-1.4, 2.25, 0);

            const rightPillar = new THREE.Mesh(archShape, frameMat);
            rightPillar.position.set(1.4, 2.25, 0);

            const topBar = new THREE.Mesh(topArchShape, frameMat);
            topBar.position.set(0, 4.3, 0);

            group.add(leftPillar, rightPillar, topBar);

            // Portal Glow Surface
            const portalGeom = new THREE.PlaneGeometry(2.4, 4.1);
            const portalMat = new THREE.MeshBasicMaterial({
                color: glowColorHex,
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide
            });
            const portalPlane = new THREE.Mesh(portalGeom, portalMat);
            portalPlane.position.set(0, 2.1, 0);
            group.add(portalPlane);

            // Neon Edges
            const borderGeom = new THREE.BoxGeometry(2.6, 4.3, 0.1);
            const borderEdges = new THREE.EdgesGeometry(borderGeom);
            const borderMat = new THREE.LineBasicMaterial({ color: glowColorHex, linewidth: 2 });
            const borderLines = new THREE.LineSegments(borderEdges, borderMat);
            borderLines.position.set(0, 2.15, 0);
            group.add(borderLines);

            return { group, portalMat, borderMat };
        }

        const leftGateObj = createGateMesh(STAGE_THEMES[0].blueGateColor);
        leftGateObj.group.position.set(-2.5, 0, -2);
        scene.add(leftGateObj.group);

        const rightGateObj = createGateMesh(STAGE_THEMES[0].redGateColor);
        rightGateObj.group.position.set(2.5, 0, -2);
        scene.add(rightGateObj.group);

        createFloatingEnvironment(STAGE_THEMES[0].geometryType);

        // --- GAME LOGIC & RANDOMIZATION ---
        function randomizeGate() {
            correctGate = Math.random() < 0.5 ? 'blue' : 'red';
            console.log(`[Stage ${currentStage + 1}] Correct gate: ${correctGate.toUpperCase()}`);
        }

        function updateStageVisuals(stageIdx) {
            const theme = STAGE_THEMES[stageIdx % STAGE_THEMES.length];

            // Background & Fog
            scene.fog.color.setHex(theme.fogColor);
            renderer.setClearColor(theme.bgColor);

            // Gate Colors Update
            leftGateObj.portalMat.color.setHex(theme.blueGateColor);
            leftGateObj.borderMat.color.setHex(theme.blueGateColor);
            blueGateLight.color.setHex(theme.blueGateColor);

            rightGateObj.portalMat.color.setHex(theme.redGateColor);
            rightGateObj.borderMat.color.setHex(theme.redGateColor);
            redGateLight.color.setHex(theme.redGateColor);

            // Particles
            particleMaterial.color.setHex(theme.particlesColor);
            
            // Grid Update
            scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(100, 50, theme.blueGateColor, theme.gridColor);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Reset Grid position in case of previous death animation
            gridHelper.position.x = 0;

            // Mirror World Ceiling Grid
            if (theme.specialEffect === 'mirror') {
                ceilingGridHelper.visible = true;
                ceilingGridHelper.material.color.setHex(theme.redGateColor);
            } else {
                ceilingGridHelper.visible = false;
            }

            // Creature World
            creatureGroup.visible = (theme.specialEffect === 'creature');
            creatureGroup.position.set(0, 3.5, -6);
            creatureGroup.scale.set(1, 1, 1);

            // Floating Geometries
            createFloatingEnvironment(theme.geometryType);

            // UI HUD Update
            document.getElementById('stage-title-hud').innerText = `STAGE ${stageIdx + 1} - ${theme.name}`;
            document.getElementById('current-streak-val').innerText = `${stageIdx} 回`;
            document.getElementById('best-streak-val').innerText = `${bestStreak} 回`;

            // Probability Calculation: 1 / 2^(stageIdx + 1)
            const denominatorBig = Math.pow(2, stageIdx + 1);
            let displayDenom = denominatorBig.toLocaleString();
            let displayPercent = (100 / denominatorBig);

            if (stageIdx >= 30) {
                displayDenom = "2^" + (stageIdx + 1);
                displayPercent = "0.0000...%";
            } else {
                displayPercent = displayPercent.toFixed(Math.min(stageIdx + 3, 8)) + "%";
            }
            
            document.getElementById('prob-denominator').innerText = displayDenom;
            document.getElementById('prob-percent').innerText = displayPercent;
        }

        // --- GATE CHOICE ACTION & CAMERA MOTIONS ---
        function selectGate(chosenColor) {
            if (isMoving) return;
            isMoving = true;
            initAudio();

            const isCorrect = (chosenColor === correctGate);
            const targetX = chosenColor === 'blue' ? -2.5 : 2.5;

            let startTime = performance.now();
            const startCameraX = camera.position.x;
            const startCameraZ = camera.position.z;

            playSound('warp');

            function animateCamera(now) {
                const elapsed = (now - startTime) / 1000;
                const duration = 0.8;
                const progress = Math.min(elapsed / duration, 1);

                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

                camera.position.x = startCameraX + (targetX - startCameraX) * ease;
                camera.position.z = startCameraZ + (-3 - startCameraZ) * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                } else {
                    handleGateOutcome(isCorrect, chosenColor);
                }
            }

            requestAnimationFrame(animateCamera);
        }

        function handleGateOutcome(isCorrect, chosenColor) {
            if (isCorrect) {
                playSound('correct');
                currentStage++;
                
                // Update Best Streak
                if (currentStage > bestStreak) {
                    bestStreak = currentStage;
                    localStorage.setItem('probability_labyrinth_best', bestStreak.toString());
                }

                randomizeGate();
                updateStageVisuals(currentStage);

                // Reset Camera Position
                camera.position.set(0, 1.6, 6);
                camera.rotation.set(0, 0, 0);
                camera.fov = 65;
                camera.updateProjectionMatrix();
                isMoving = false;
            } else {
                // GAME OVER - DYNAMIC DEATH ANIMATIONS
                triggerDeathAnimation(chosenColor);
            }
        }

        // --- DYNAMIC DEATH ANIMATION SYSTEM ---
        function triggerDeathAnimation(chosenColor) {
            playSound('wrong');
            const theme = STAGE_THEMES[currentStage % STAGE_THEMES.length];
            
            // Choose death style based on stage or random selection
            let deathTypes = ['fall', 'fissure', 'crush', 'laser'];
            if (theme.specialEffect === 'creature') {
                deathTypes.push('eat', 'eat'); // Higher chance to get eaten when creature exists
            }

            const deathType = deathTypes[Math.floor(Math.random() * deathTypes.length)];
            let deathDuration = 1.2;

            let startTime = performance.now();

            if (deathType === 'fall') {
                lastDeathCause = "底なしの崖へ落下";
            } else if (deathType === 'eat') {
                lastDeathCause = "謎の変な奴に捕食された";
                playSound('roar');
                creatureGroup.visible = true;
            } else if (deathType === 'fissure') {
                lastDeathCause = "次元の裂け目に飲まれた";
            } else if (deathType === 'crush') {
                lastDeathCause = "空間圧縮により粉砕";
            } else {
                lastDeathCause = "トラップレーザーにより消滅";
            }

            function playDeathFrame(now) {
                const elapsed = (now - startTime) / 1000;
                const progress = Math.min(elapsed / deathDuration, 1);

                if (deathType === 'fall') {
                    // Camera plunges downward with tilt
                    camera.position.y = 1.6 - (progress * progress * 20);
                    camera.rotation.x = -progress * 1.2;
                    camera.rotation.z = progress * 0.5;
                } 
                else if (deathType === 'eat') {
                    // Creature rapidly grows and devours camera
                    creatureGroup.position.set(camera.position.x, 1.6, camera.position.z - (1 - progress) * 5);
                    const scale = 1 + progress * 8;
                    creatureGroup.scale.set(scale, scale, scale);
                    camera.rotation.z = (Math.random() - 0.5) * 0.2;
                } 
                else if (deathType === 'fissure') {
                    // Floor splits & screen shakes violently
                    gridHelper.position.x = (progress * 10) * (chosenColor === 'blue' ? -1 : 1);
                    camera.position.y = 1.6 - progress * 10;
                    camera.position.x += (Math.random() - 0.5) * 0.4;
                    camera.position.z += (Math.random() - 0.5) * 0.4;
                } 
                else if (deathType === 'crush') {
                    // Lens warp distortion and spiral camera
                    camera.fov = 65 + progress * 80;
                    camera.updateProjectionMatrix();
                    camera.rotation.z = progress * Math.PI * 2;
                }
                else { // Laser
                    renderer.setClearColor(0xff0033);
                    camera.position.z += (Math.random() - 0.5) * 0.3;
                    camera.position.y += (Math.random() - 0.5) * 0.3;
                }

                if (progress < 1) {
                    requestAnimationFrame(playDeathFrame);
                } else {
                    renderer.setClearColor(0x000000);
                    showGameEndModal(false);
                }
            }

            requestAnimationFrame(playDeathFrame);
        }

        // --- MODAL & UI HANDLERS ---
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalStats = document.getElementById('modal-stats');
        const modalActionBtn = document.getElementById('modal-action-btn');

        const iconStart = document.getElementById('modal-icon-start');
        const iconFail = document.getElementById('modal-icon-fail');

        function showGameEndModal(isStart) {
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            iconStart.classList.add('hidden');
            iconFail.classList.add('hidden');

            if (isStart) {
                modalStats.classList.add('hidden');
                modalTitle.innerText = "確率の迷宮";
                modalTitle.className = "text-2xl md:text-3xl font-black font-orbitron tracking-wide mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-blue-300";
                modalDesc.innerHTML = `2分の1の選択を当て続けろ！<br>どこまで連続正解できるか限界に挑戦。<br>進むたびに変形する怪しい世界を突き進め。`;
                iconStart.classList.remove('hidden');
                modalActionBtn.innerText = "CHALLENGE START";
            } else {
                modalStats.classList.remove('hidden');
                document.getElementById('stat-stage').innerText = `${currentStage} 回連続成功`;
                
                const denom = Math.pow(2, currentStage).toLocaleString();
                document.getElementById('stat-prob').innerText = `1 / ${denom}`;
                document.getElementById('stat-cause').innerText = lastDeathCause;
                document.getElementById('stat-best').innerText = `${bestStreak} 回連続成功`;

                modalTitle.innerText = "PROBABILITY FAILED";
                modalTitle.className = "text-2xl md:text-3xl font-black font-orbitron tracking-wide mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-pink-300 to-white glow-red";
                modalDesc.innerHTML = `<span class="text-red-400 font-bold">ハズレのゲートを選択しました。</span><br>確率の壁に阻まれました。もう一度挑戦しますか？`;
                iconFail.classList.remove('hidden');
                modalActionBtn.innerText = "RETRY CHALLENGE";
            }
        }

        function startNewGame() {
            currentStage = 0;
            isMoving = false;

            // Reset camera state
            camera.position.set(0, 1.6, 6);
            camera.rotation.set(0, 0, 0);
            camera.fov = 65;
            camera.updateProjectionMatrix();

            randomizeGate();
            updateStageVisuals(0);

            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        // Event Listeners
        document.getElementById('modal-action-btn').addEventListener('click', () => {
            initAudio();
            startNewGame();
        });

        document.getElementById('left-touch-zone').addEventListener('click', () => selectGate('blue'));
        document.getElementById('right-touch-zone').addEventListener('click', () => selectGate('red'));

        window.addEventListener('keydown', (e) => {
            if (modalOverlay.classList.contains('pointer-events-none')) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    selectGate('blue');
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    selectGate('red');
                }
            } else if (e.key === 'Enter' || e.key === ' ') {
                startNewGame();
            }
        });

        document.getElementById('sound-btn').addEventListener('click', () => {
            initAudio();
            isSoundMuted = !isSoundMuted;
            document.getElementById('sound-icon-on').classList.toggle('hidden', isSoundMuted);
            document.getElementById('sound-icon-off').classList.toggle('hidden', !isSoundMuted);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN RENDER LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001;

            // Idle Gate Animation
            leftGateObj.group.position.y = Math.sin(t * 2) * 0.08;
            rightGateObj.group.position.y = Math.sin(t * 2 + 1) * 0.08;

            // Creature Animation (If visible)
            if (creatureGroup.visible) {
                creatureGroup.position.y = 3.5 + Math.sin(t * 3) * 0.3;
                if (creatureCoreMesh) {
                    creatureCoreMesh.rotation.x = t * 1.5;
                    creatureCoreMesh.rotation.y = t * 2.0;
                }
                if (creatureEyeMesh) {
                    creatureEyeMesh.lookAt(camera.position);
                }
            }

            // Floating background meshes
            floatingMeshes.forEach((mesh, idx) => {
                mesh.rotation.x += 0.005 * (idx % 2 === 0 ? 1 : -1);
                mesh.rotation.y += 0.008;
            });

            // Particles Drift
            const positions = particleGeometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                positions[i] -= 0.02;
                if (positions[i] < 0) positions[i] = 20;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.onload = function() {
            document.getElementById('best-streak-val').innerText = `${bestStreak} 回`;
            randomizeGate();
            updateStageVisuals(0);
            showGameEndModal(true);
            animate(0);
        };
    </script>
</body>
</html>
